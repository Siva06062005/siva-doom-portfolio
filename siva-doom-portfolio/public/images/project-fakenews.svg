  <text x="310" y="145" fill="#a0b4a8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">-209 Duplicates</text>
  <text x="310" y="165" fill="#a0b4a8" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">-631 Empty Rows</text>
  <text x="310" y="195" fill="#39e68b" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', monospace">44,058 Clean Rows</text>

