  <rect x="575" y="305" width="170" height="85" fill="#040c07" stroke="#39e68b" stroke-opacity="0.3" rx="4" />
  <text x="660" y="338" fill="#39e68b" font-size="18" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700">SCIKIT-LEARN</text>
