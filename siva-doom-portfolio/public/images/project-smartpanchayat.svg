  <!-- Center Shield Icon -->
  <polygon points="400,165 440,195 440,245 400,285 360,245 360,195" fill="#142036" stroke="#f0a030" stroke-width="3" filter="drop-shadow(0 0 10px rgba(240,160,48,0.4))" />
  <text x="400" y="232" fill="#22d1ee" font-size="28" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900">Ξ</text>

