  <text x="50" y="44" fill="#22d1ee" font-size="14" font-family="'Orbitron', sans-serif" font-weight="700">SMARTPANCHAYAT // DECENTRALIZED GOVERNANCE DAPP</text>
  <text x="740" y="44" fill="#39e68b" font-size="12" text-anchor="end" font-family="'JetBrains Mono', monospace">STATUS: IMMUTABLE ✓</text>
