    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Blockchain Nodes Connection -->
  <path d="M150 225 L300 120 L500 120 L650 225 L500 330 L300 330 Z" fill="none" stroke="url(#ethGrad)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Blocks -->
  <g fill="#0e1424" stroke="url(#ethGrad)" stroke-width="2.5">
    <rect x="110" y="195" width="80" height="60" rx="6" />
    <rect x="260" y="90" width="80" height="60" rx="6" />
    <rect x="460" y="90" width="80" height="60" rx="6" />
    <rect x="610" y="195" width="80" height="60" rx="6" />
