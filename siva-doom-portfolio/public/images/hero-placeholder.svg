<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#0d1520" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#22d1ee" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#e83a3a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a030" />
      <stop offset="100%" stop-color="#d7b46a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#arcGlow)" />

  <!-- Tech Grid Background -->
  <g stroke="#22d1ee" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800M0 500h800M0 600h800M0 700h800M0 800h800M0 900h800" />
    <path d="M100 0v1000M200 0v1000M300 0v1000M400 0v1000M500 0v1000M600 0v1000M700 0v1000" />
  </g>

  <!-- Outer HUD Rings -->
  <g fill="none" stroke="#22d1ee" stroke-opacity="0.35">
    <circle cx="400" cy="460" r="340" stroke-width="1" stroke-dasharray="8 6" />
    <circle cx="400" cy="460" r="280" stroke-width="2" />
    <circle cx="400" cy="460" r="230" stroke-width="1.5" stroke-dasharray="16 8" />
  </g>

  <g fill="none" stroke="#e83a3a" stroke-opacity="0.4">
    <circle cx="400" cy="460" r="180" stroke-width="2" />
    <path d="M200 460h400M400 260v400" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Armor Core Hexagon Silhouette -->
  <path d="M400 200 L560 300 L560 620 L400 720 L240 620 L240 300 Z" fill="#080e16" stroke="url(#goldGrad)" stroke-width="4" filter="drop-shadow(0 0 15px rgba(240,160,48,0.3))" />

  <path d="M400 230 L530 315 L530 605 L400 690 L270 605 L270 315 Z" fill="#0c1622" stroke="#22d1ee" stroke-opacity="0.5" stroke-width="2" />

  <!-- Arc Reactor Center Emblem -->
  <circle cx="400" cy="460" r="85" fill="#050a10" stroke="#e83a3a" stroke-width="4" />
  <circle cx="400" cy="460" r="70" fill="none" stroke="#22d1ee" stroke-width="3" stroke-dasharray="12 6" />
  <circle cx="400" cy="460" r="48" fill="#0e1f2e" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Central Crest S -->
  <text x="400" y="482" fill="#22d1ee" font-size="64" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" filter="drop-shadow(0 0 10px #22d1ee)">S</text>

  <!-- HUD Data Readouts Overlay -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#22d1ee" opacity="0.8">
    <text x="260" y="280">SYS//ARC_REACTOR_ONLINE</text>
    <text x="260" y="650">OUTPUT::100%_OPERATIONAL</text>
    <text x="440" y="280">VOLTAGE::MAX_CAPACITY</text>
    <text x="440" y="650">DEVOPS//AUTOMATION_SET</text>
  </g>

  <!-- Bottom Crest Label -->
  <rect x="250" y="850" width="300" height="42" fill="#0a121c" stroke="url(#goldGrad)" stroke-width="1.5" rx="4" />
  <text x="400" y="877" fill="#f0f0f5" font-size="16" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700" letter-spacing="4">SIVA S // DEVOPS CORE</text>
</svg>