<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 875">
  <defs>
    <linearGradient id="profBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c09" />
      <stop offset="50%" stop-color="#0f1f17" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39e68b" />
      <stop offset="100%" stop-color="#22d1ee" />
    </linearGradient>
  </defs>

  <rect width="700" height="875" fill="url(#profBg)" />

  <!-- Grid pattern -->
  <g stroke="#39e68b" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100h700M0 200h700M0 300h700M0 400h700M0 500h700M0 600h700M0 700h700M0 800h700" />
    <path d="M100 0v875M200 0v875M300 0v875M400 0v875M500 0v875M600 0v875" />
  </g>

  <!-- Reticle Target Lines -->
  <circle cx="350" cy="360" r="220" fill="none" stroke="#39e68b" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="10 5" />
  <circle cx="350" cy="360" r="160" fill="none" stroke="#39e68b" stroke-opacity="0.35" stroke-width="2" />
  <path d="M100 360h500M350 110v500" stroke="#39e68b" stroke-opacity="0.2" stroke-width="1" />

  <!-- Engineer Silhouette Avatar -->
  <path d="M120 780 C150 580 230 480 350 480 C470 480 550 580 580 780 Z" fill="#0d1f16" stroke="url(#accentGreen)" stroke-width="3" />
  <circle cx="350" cy="320" r="110" fill="#132a1e" stroke="url(#accentGreen)" stroke-width="4" filter="drop-shadow(0 0 12px rgba(57,230,139,0.3))" />

  <!-- Central Crest Emblem -->
  <text x="350" y="348" fill="#39e68b" font-size="80" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" filter="drop-shadow(0 0 10px #39e68b)">S</text>

  <!-- Biometric HUD overlay -->
  <rect x="50" y="50" width="180" height="40" fill="#09140e" stroke="#39e68b" stroke-opacity="0.4" rx="3" />
  <text x="65" y="75" fill="#39e68b" font-size="12" font-family="'JetBrains Mono', monospace">BIO_SCAN::VERIFIED</text>

  <rect x="470" y="50" width="180" height="40" fill="#09140e" stroke="#d7b46a" stroke-opacity="0.4" rx="3" />
  <text x="485" y="75" fill="#d7b46a" font-size="12" font-family="'JetBrains Mono', monospace">CLEARANCE::LEVEL_5</text>

  <!-- Bottom Label -->
  <rect x="150" y="800" width="400" height="48" fill="#08120c" stroke="url(#accentGreen)" stroke-width="2" rx="4" />
  <text x="350" y="830" fill="#e8f0ea" font-size="16" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="700" letter-spacing="4">SIVA S // DEVOPS ENGINEER</text>
</svg>